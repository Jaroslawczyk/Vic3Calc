<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Калькулятор Victoria 3</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!--
  ============================================================================
  EN: WHY THIS FILE LOOKS LIKE 1998
      Plain <script> tags, no bundler, no ES modules. That is deliberate.
      The app must run by double-clicking an icon, from a folder, with no
      installation and no internet - so it is loaded over file://, and browsers
      refuse to load ES modules over file://. Classic scripts still work.

      LOAD ORDER MATTERS and is grouped below. Roughly:
        core -> data -> engine -> languages -> interface -> start

  RU: ПОЧЕМУ ЭТОТ ФАЙЛ ВЫГЛЯДИТ КАК ИЗ 1998 ГОДА
      Обычные <script>, без сборщика и ES-модулей. Это намеренно.
      Программа должна запускаться двойным щелчком по ярлыку, из папки, без
      установки и без интернета - то есть по file://, а ES-модули браузеры по
      file:// не грузят. Обычные скрипты работают.

      ПОРЯДОК ЗАГРУЗКИ ВАЖЕН, он сгруппирован ниже:
        ядро -> данные -> движок -> языки -> интерфейс -> запуск
  ============================================================================
-->

<link rel="stylesheet" href="styles/01-tokens.css">
<link rel="stylesheet" href="styles/02-base.css">
<link rel="stylesheet" href="styles/03-components.css">
<link rel="stylesheet" href="styles/04-layout.css">
<link rel="stylesheet" href="styles/05-chain.css">
<link rel="stylesheet" href="styles/06-views.css">
</head>

<body data-theme="parchment">

<div id="app">
  <!-- Shown only if the scripts below never run. -->
  <noscript style="padding:40px;display:block;font-family:Georgia,serif">
    JavaScript is disabled. / JavaScript отключён.
  </noscript>
</div>

<!-- ==========================================================================
     1. CORE - namespace, data registry, translation, storage
     ========================================================================= -->
<script src="core/ns.js"></script>
<script src="core/registry.js"></script>
<script src="core/i18n.js"></script>
<script src="core/num.js"></script>
<script src="core/storage.js"></script>
<script src="core/userdata.js"></script>

<!-- ==========================================================================
     2. DATA - the game tables. Edit these to correct a number for everyone;
        edit in the Data tab to correct it just for yourself.
        icon_manifest.js is generated by tools/gen-icon-manifest.sh.
     ========================================================================= -->
<script src="data/icon_manifest.js"></script>
<script src="core/icons.js"></script>
<script src="data/_meta.js"></script>
<script src="data/_helpers.js"></script>
<script src="data/goods.js"></script>
<script src="data/pops.js"></script>
<script src="data/building_groups.js"></script>
<script src="data/buildings.js"></script>
<script src="data/pm_groups.js"></script>
<script src="data/pm_primary.js"></script>
<script src="data/pm_industry.js"></script>
<script src="data/pm_infrastructure.js"></script>
<script src="data/pm_military.js"></script>
<script src="data/technologies.js"></script>
<script src="data/almanac.js"></script>

<!-- ==========================================================================
     3. ENGINE - the maths. Pure functions; every one takes a context first.
     ========================================================================= -->
<script src="engine/formulas.js"></script>
<script src="engine/context.js"></script>
<script src="engine/building_calc.js"></script>
<script src="engine/solver.js"></script>
<script src="engine/economy.js"></script>
<script src="engine/construction.js"></script>
<script src="engine/military.js"></script>
<script src="engine/research.js"></script>

<!-- ==========================================================================
     4. LANGUAGES - add your file here after copying lang/TEMPLATE.js.
        English must stay first: it is the fallback for every other language.
     ========================================================================= -->
<script src="lang/en.js"></script>
<script src="lang/ru.js"></script>

<!-- ==========================================================================
     5. INTERFACE
     ========================================================================= -->
<script src="ui/dom.js"></script>
<script src="ui/components.js"></script>
<script src="ui/graph.js"></script>
<script src="ui/view_chain.js"></script>
<script src="ui/view_buildings.js"></script>
<script src="ui/view_goods.js"></script>
<script src="ui/view_military.js"></script>
<script src="ui/view_almanac.js"></script>
<script src="ui/view_data.js"></script>
<script src="ui/view_settings.js"></script>
<script src="ui/app.js"></script>

<!-- ==========================================================================
     6. START
     ========================================================================= -->
<script>
(function () {
  'use strict';
  function boot() {
    try {
      window.V3.app.start();
    } catch (e) {
      // Never show a blank window: if boot fails, say why, in both languages.
      document.getElementById('app').innerHTML =
        '<div style="padding:40px;font-family:Georgia,serif;max-width:760px">' +
        '<h1 style="color:#7c2f2c">The calculator could not start / Калькулятор не запустился</h1>' +
        '<p>Please report this text:</p><pre style="white-space:pre-wrap;background:#f3ecdb;' +
        'border:1px solid #b39d76;padding:12px">' +
        String(e && e.stack || e).replace(/[<>&]/g, function (c) {
          return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c];
        }) + '</pre></div>';
      console.error(e);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>

</body>
</html>
